services:
  asterisk-gateway:
    build: .
    container_name: bricko-whatsapp-gateway
    restart: unless-stopped
    network_mode: "host"
    env_file: .env
    volumes:
      # Templates are mounted so config edits only need a restart, not a rebuild
      - ./templates:/etc/asterisk/templates:ro
      - ./certs:/etc/asterisk/certs:ro
