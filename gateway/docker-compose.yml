services:
  asterisk-gateway:
    build: .
    container_name: bricko-whatsapp-gateway
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./certs:/etc/asterisk/certs:ro
